<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter Widget</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            color: #000000;
        }

        /* MICROFOUNDARY LOGO — POLISHED SIZE + CHROME-SAFE */
        .logo {
            height: 32px;
            max-width: 120px;
            width: auto;
            object-fit: contain;
            display: block;
            margin-bottom: 6px;
        }

        /* TITLE */
        .title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
        }

        /* CONTAINER */
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
            max-width: 600px;
            margin: 0 auto;
        }

        /* TEXTAREA */
        textarea {
            width: 100%;
            height: 160px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #000;
        }

        /* BUTTON — MICROFOUNDARY BLUE, AUTO-WIDTH, LEFT-JUSTIFIED */
        button {
            padding: 10px 16px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #0078FF;
            color: white;
            cursor: pointer;
            display: inline-block;
            width: auto;
        }

        button:hover {
            opacity: 0.85;
        }

        /* OUTPUT BOX */
        #output {
            padding: 16px;
            border-radius: 8px;
            background: #fafafa;
            border: 1px solid #ddd;
            min-height: 80px;
            width: 100%;
            white-space: pre-wrap;
        }

        /* DARK MODE TOGGLE */
        .toggle {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- LOGO -->
    <img src="IMG_1669.jpeg" class="logo" alt="StarterWidget Logo">

    <!-- TITLE -->
    <div class="title">Starter Widget</div>

    <div class="container">
        <textarea id="input" placeholder="Type here…"></textarea>

        <button id="run">Run Starter</button>

        <div id="output"></div>

        <div class="toggle" id="toggle">Toggle Dark Mode</div>
    </div>

    <script>
        document.getElementById("toggle").addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });

        document.getElementById("run").addEventListener("click", () => {
            const input = document.getElementById("input").value;
            document.getElementById("output").textContent = "Starter output: " + input;
        });
    </script>

</body>
</html>
