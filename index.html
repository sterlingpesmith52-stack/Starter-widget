<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter Widget</title>

   
</head>

<body>

    <!-- LOGO FIRST LINE -->
    <div class="logo-box">
        <img src="IMG_1669.jpeg" alt="MicroFoundary Logo">
    </div>

    <!-- TITLE SECOND LINE -->
    <div class="title">Starter Widget</div>

    <div class="controls">
        <button onclick="runWidget()">Run</button>
        <button onclick="clearText()">Clear</button>
    </div>

    <textarea id="input" placeholder="Paste text here..."></textarea>

    <script>
        function runWidget() {
            const box = document.getElementById("input");
            box.value = "Starter Widget executed.";
        }

        function clearText() {
            document.getElementById("input").value = "";
        }
    </script>

</body>
</html>
