<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starter Widget</title>

<style>
    /* ===============================
       MICROFOUNDARY STANDARD STYLES
       =============================== */

    :root {
        --mf-primary: #007AFF;      /* Clarifier blue */
        --mf-primary-active: #005FCC;
        --mf-secondary: #000000;    /* Black secondary */
        --mf-secondary-active: #222222;
        --mf-border: #ccc;
        --mf-text: #000;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: var(--mf-text);
    }

    /* HEADER */
    .header-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
    }

    .logo {
        height: 48px;
        width: auto;
        object-fit: contain;
    }

    .title {
        font-size: 28px;
        font-weight: 600;
    }

    /* MAIN CONTAINER */
    .container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 500px;
    }

    /* BUTTONS — Standard MicroFoundary */
    button {
        padding: 10px 16px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        width: auto;
        display: inline-block;
    }

    /* Primary (blue) */
    .run-btn {
        background: var(--mf-primary);
        color: white;
    }
    .run-btn:active {
        background: var(--mf-primary-active);
    }

    /* Secondary/minor (black) */
    .clear-btn {
        background: var(--mf-secondary);
        color: white;
    }
    .clear-btn:active {
        background: var(--mf-secondary-active);
    }

    /* TEXTAREA */
    textarea {
        width: 100%;
        height: 180px;
        padding: 12px;
        font-size: 16px;
        border: 1px solid var(--mf-border);
        border-radius: 6px;
        resize: none;
        box-sizing: border-box;
    }

    textarea:focus {
        outline: none;
        border-color: #000;
    }
</style>
</head>

<body>

    <div class="header-row">
        <img src="IMG_1669.jpeg" class="logo" alt="Starter Widget Logo">
        <div class="title">Starter Widget</div>
    </div>

    <div class="container">
        <button class="run-btn" id="runBtn">Run</button>
        <button class="clear-btn" id="clearBtn">Clear</button>

        <textarea id="inputBox" placeholder="Paste text here..."></textarea>
    </div>

<script>
    const runBtn = document.getElementById("runBtn");
    const clearBtn = document.getElementById("clearBtn");
    const inputBox = document.getElementById("inputBox");

    runBtn.onclick = () => {
        alert("Run button pressed. (Add your logic here.)");
    };

    clearBtn.onclick = () => {
        inputBox.value = "";
    };
</script>

</body>
</html>
