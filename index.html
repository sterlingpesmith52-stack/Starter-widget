<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter Widget</title>

  <style>
    body {
      font-family: sans-serif;
      font-size: 5vw;        /* Scales with screen width */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f7f7f7;
    }

    h2 {
      font-size: 6vw;        /* Larger heading */
      margin-bottom: 4vh;
    }

    button {
      font-size: 5vw;        /* Large button text */
      padding: 3vh 6vw;      /* Large tap area */
      border-radius: 8px;
      margin-top: 2vh;
    }

    #out {
      margin-top: 3vh;
      font-size: 5vw;
    }
  </style>
</head>

<body>
  <h2>Starter Widget</h2>

  <button onclick="document.getElementById('out').textContent = 'Widget activated'">
    Activate
  </button>

  <p id="out"></p>
</body>
</html>
