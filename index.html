<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter Widget</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 16px;
            background: white;
        }

        /* Logo on its own line */
        .logo-box {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 8px;
        }

        .logo-box img {
            height: 28px;
            width: auto;
        }

        /* Title on second line */
        .title {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 20px 0;
            text-align: left;
        }

        /* Buttons row */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        /* MicroFoundary button styling */
        button {
            padding: 8px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            text-align: left;
            width: auto; /* auto-width, left-aligned */
        }

        /* Text area */
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
        }
    </style>
</head>

<body>

    <!-- LOGO FIRST LINE -->
    <div class="logo-box">
        <img src="microfoundary-logo.png" alt="MicroFoundary Logo" />
    </div>

    <!-- TITLE SECOND LINE -->
    <div class="title">Starter Widget</div>

    <div class="controls">
        <button onclick="runWidget()">Run</button>
        <button onclick="clearText()">Clear</button>
    </div>

    <textarea id="input" placeholder="Paste text here..."></textarea>

    <script>
        function runWidget() {
            const box = document.getElementById("input");
            // Placeholder behavior — replace with your widget logic
            box.value = "Starter Widget executed.";
        }

        function clearText() {
            document.getElementById("input").value = "";
        }
    </script>

</body>
</html>
