<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starter Widget</title>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background: #f5f5f5;
        color: #222;
        text-align: center;
    }

    header {
        background: white;
        padding: 20px 10px;
        border-bottom: 1px solid #ddd;
    }

    header img {
        width: 70px;
        height: auto;
        border-radius: 10px;
    }

    h1 {
        margin: 10px 0 0 0;
        font-size: 26px;
        font-weight: 600;
    }

    .container {
        margin: 25px auto;
        width: 90%;
        max-width: 500px;
        text-align: left;
    }

    .button-row {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    button {
        flex: 1;
        padding: 12px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        cursor: pointer;
    }

    button:active {
        background: #005fcc;
    }

    textarea {
        width: 100%;
        height: 200px;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
        resize: none;
        box-sizing: border-box;
    }
</style>
</head>

<body>

<header>
    <img src="IMG_1669.jpeg" alt="MicroFoundary Logo" />
    <h1>MicroFoundary — Starter Widget</h1>
</header>

<div class="container">
    <div class="button-row">
        <button id="runBtn">Run</button>
        <button id="clearBtn">Clear</button>
    </div>

    <textarea id="inputBox" placeholder="Paste text here..."></textarea>
</div>

<script>
    const runBtn = document.getElementById("runBtn");
    const clearBtn = document.getElementById("clearBtn");
    const inputBox = document.getElementById("inputBox");

    runBtn.onclick = () => {
        alert("Run button pressed. (Add your logic here.)");
    };

    clearBtn.onclick = () => {
        inputBox.value = "";
    };
</script>

</body>
</html>
