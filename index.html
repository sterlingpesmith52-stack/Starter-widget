<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starter Widget</title>

<style>
    /* Base container */
    .widget-container {
        font-size: 1.4rem;        /* Larger baseline font */
        font-family: Arial, sans-serif;
        padding: 1rem;
        max-width: 400px;
        margin: auto;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    /* Title */
    .widget-title {
        font-size: 1.6rem;
        font-weight: 600;
        margin-bottom: 1rem;
    }

    /* Textarea */
    .widget-textarea {
        width: 100%;
        height: 120px;
        font-size: 1.3rem;
        padding: 0.5rem;
        border-radius: 6px;
        border: 1px solid #aaa;
        box-sizing: border-box;
    }

    /* Mode display */
    .widget-mode-display {
        margin-top: 1rem;
        font-size: 1.3rem;
        font-weight: 500;
    }

    /* Buttons */
    .widget-button {
        font-size: 1.3rem;
        padding: 0.6rem 1rem;
        margin-top: 1rem;
        border-radius: 6px;
        border: none;
        background-color: #0078d4;
        color: white;
        cursor: pointer;
    }

    .widget-button:hover {
        background-color: #005fa3;
    }
</style>
</head>

<body>
<div class="widget-container">
    <div class="widget-title">Starter Widget</div>

    <textarea class="widget-textarea" placeholder="Type here..."></textarea>

    <div class="widget-mode-display">Mode: Starter</div>

    <button class="widget-button">Run Starter</button>
</div>
</body>
</html>
