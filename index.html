<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Starter Widget</title>

  <style>
    body {
      font-family: sans-serif;
      font-size: 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
    }

    button {
      font-size: 20px;
      padding: 12px 24px;
      margin-top: 20px;
    }

    #out {
      margin-top: 20px;
      font-size: 22px;
    }
  </style>
</head>

<body>
  <h2>Starter Widget</h2>

  <button onclick="document.getElementById('out').textContent = 'Widget activated'">
    Activate
  </button>

  <p id="out"></p>
</body>
</html>
