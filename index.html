
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starter Widget</title>

<style>
    :root {
        --mf-primary: #007AFF;
        --mf-primary-active: #005FCC;
        --mf-secondary: #000000;
        --mf-secondary-active: #222222;
        --mf-border: #ccc;
        --mf-text: #000;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: var(--mf-text);
    }

    .header-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 12px;
    }

    .logo {
        height: 32px;
        width: auto;
        object-fit: contain;
        margin-bottom: 6px;
    }

    .title {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 12px;
    }

    .container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 500px;
    }

    /* FIXED BUTTON ROW */
    .button-row {
        display: flex !important;
        flex-direction: row !important;
        justify-content: flex-start !important;
        align-items: center !important;
        gap: 10px !important;
        width: 100%;
    }

    button {
        padding: 10px 16px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        width: auto !important;        /* FORCE auto width */
        display: inline-block !important;
        flex: 0 0 auto !important;      /* Prevent stretching */
    }

    .run-btn {
        background: var(--mf-primary);
        color: white;
    }
    .run-btn:active {
        background: var(--mf-primary-active);
    }

    .clear-btn {
        background: var(--mf-secondary);
        color: white;
    }
    .clear-btn:active {
        background: var(--mf-secondary-active);
    }

    textarea {
        width: 100%;
        height: 120px;
        padding: 12px;
        font-size: 16px;
        border: 1px solid var(--mf-border);
        border-radius: 6px;
        resize: none;
        box-sizing: border-box;
    }

    textarea:focus {
        outline: none;
        border-color: #000;
    }
</style>
</head>

<body>

    <div class="header-row">
        <img src="IMG_1669.jpeg" class="logo" alt="Starter Widget Logo">
        <div class="title">Starter Widget</div>
    </div>

    <div class="container">

        <!-- FIXED BUTTON ROW -->
        <div class="button-row">
            <button class="run-btn" id="runBtn">Run</button>
            <button class="clear-btn" id="clearBtn">Clear</button>
        </div>

        <textarea id="inputBox" placeholder="Paste text here..."></textarea>
    </div>

<script>
    const runBtn = document.getElementById("runBtn");
    const clearBtn = document.getElementById("clearBtn");
    const inputBox = document.getElementById("inputBox");

    runBtn.onclick = () => {
        alert("Run button pressed. (Add your logic here.)");
    };

    clearBtn.onclick = () => {
        inputBox.value = "";
    };
</script>

</body>
</html>
